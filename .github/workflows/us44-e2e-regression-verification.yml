name: Sprint 5 - US44 Full MVP Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master, kduy]
    paths:
      - ".github/workflows/us44-e2e-regression-verification.yml"
  pull_request:
    paths:
      - ".github/workflows/us44-e2e-regression-verification.yml"

jobs:
  verify-us44-regression:
    name: Run US-44 Full MVP End-to-End Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (root monorepo)
        run: bun install --frozen-lockfile || npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"

      - name: Run US-44 Full MVP Regression Vitest & Authorization Suite
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"
        run: |
          set -o pipefail
          {
            echo "=== 1. Auth, RBAC & Ownership Isolation Regression (SP5-44-005 & 010) ==="
            npm run test:authorization
            npm run test:idempotency

            echo "=== 2. Favorites, Trip Edit, AI Edit & In-Trip Regression (SP5-44-005, 007, 008, 009) ==="
            npx vitest run --config vitest.config.mts \
              src/modules/favorite/us34-favorite-list.vitest.test.ts \
              src/modules/trip-edit/us32-test.vitest.test.ts \
              src/modules/trip-edit/us33-test.vitest.test.ts \
              src/modules/in-trip/us36-test.vitest.test.ts \
              src/modules/in-trip/us37-test.vitest.test.ts \
              --reporter=verbose
          } | tee us44-ci-report.txt

      - name: Upload US-44 Regression Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us44-verification-evidence
          path: apps/web/us44-ci-report.txt
          retention-days: 30
