
name: Sprint 4 - US30 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - kduy
    paths:
      - '.github/workflows/us30-trip-save-tests.yml'

permissions:
  contents: read

jobs:
  test-us30:
    name: Run US30 Trip Save Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run US30 tests
        working-directory: apps/web
        run: |
          npx --no-install vitest run \
            --config vitest.config.mts \
            src/modules/trip-save/trip-save.vitest.test.ts \
            src/modules/trip-save/trip-save-client.vitest.test.ts \
            src/modules/trip-save/trip-save-http.vitest.test.ts \
            src/modules/trip-save/trip-save-panel.vitest.test.ts \
            src/modules/trip-save/trip-save-adapter.vitest.test.ts \
            src/modules/trip-save/trip-save-unchecked.vitest.test.ts \
            src/components/trip-planner/planner-ui.vitest.test.ts
