name: Sprint 4 - US-ADMIN Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master, kduy]
    paths:
      - "apps/web/src/modules/admin-users/**"
      - "apps/web/src/app/api/admin/users/**"
      - "apps/web/src/app/admin/users/**"
      - ".github/workflows/us-admin-users-verification.yml"
  pull_request:
    paths:
      - "apps/web/src/modules/admin-users/**"
      - "apps/web/src/app/api/admin/users/**"
      - "apps/web/src/app/admin/users/**"
      - ".github/workflows/us-admin-users-verification.yml"

jobs:
  verify-us-admin:
    name: Run US-ADMIN User CMS & RBAC Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (root monorepo)
        run: bun install --frozen-lockfile || npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"

      - name: Run US-ADMIN Vitest Suite
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"
        run: |
          set -o pipefail
          npx vitest run --config vitest.config.mts \
            src/modules/admin-users/admin-users.vitest.test.ts \
            src/modules/admin-users/admin-user-fixtures.vitest.test.ts \
            --reporter=verbose | tee us-admin-ci-report.txt

      - name: Upload US-ADMIN Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-admin-verification-evidence
          path: apps/web/us-admin-ci-report.txt
          retention-days: 30
