name: Sprint 5 - US41 Performance Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master, kduy]
    paths:
      - "scripts/performance/**"
      - "apps/web/src/modules/trip-validation/**"
      - "apps/web/src/modules/preference-extraction/**"
      - ".github/workflows/us41-performance-verification.yml"
  pull_request:
    paths:
      - "scripts/performance/**"
      - ".github/workflows/us41-performance-verification.yml"

jobs:
  verify-us41:
    name: Run US-41 Performance & Timeout SLA Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (root monorepo)
        run: bun install --frozen-lockfile || npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"

      - name: Run US-41 Validator, Routing Timeout & Extraction SLA Tests
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"
        run: |
          set -o pipefail
          {
            echo "=== 1. Running Validator & Routing Timeout SLA Tests (SP5-41-003 & 007) ==="
            npx vitest run --config vitest.config.mts \
              src/modules/trip-validation/travel-time.vitest.test.ts \
              src/modules/in-trip/in-trip-validation.vitest.test.ts \
              --reporter=verbose

            echo "=== 2. Running Preference Extraction & AI Latency Guard Tests (SP5-41-009 & 010) ==="
            PREF_TESTS=$(find src/modules/preference-extraction -name "*.vitest.test.ts")
            if [ -n "$PREF_TESTS" ]; then
              npx vitest run --config vitest.config.mts $PREF_TESTS --reporter=verbose
            fi
          } | tee us41-ci-report.txt

      - name: Upload US-41 Performance Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us41-verification-evidence
          path: apps/web/us41-ci-report.txt
          retention-days: 30
