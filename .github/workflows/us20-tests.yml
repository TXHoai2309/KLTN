
name: Sprint 3 - US20 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - kduy

permissions:
  contents: read

jobs:
  test-us20:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup npm
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Test RAG lifecycle
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test \
            src/modules/rag-document/rag-review.test.ts \
            2>&1 | tee ../../us20-lifecycle.log

      - name: Test retrieval
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --config vitest.config.mts \
            src/modules/ai/qa-retrieval.vitest.test.ts \
            2>&1 | tee ../../us20-retrieval.log

      - name: Test PostgreSQL integration
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-qa-postgres.mjs \
            2>&1 | tee ../../us20-postgres.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: US20-Test-Evidence
          path: |
            us20-lifecycle.log
            us20-retrieval.log
            us20-postgres.log
          if-no-files-found: warn
