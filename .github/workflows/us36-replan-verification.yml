name: Sprint 4 - US36 Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master, kduy]
    paths:
      - "apps/web/src/modules/in-trip/**"
      - "apps/web/src/app/api/trips/[id]/in-trip/**"
      - ".github/workflows/us36-replan-verification.yml"
  pull_request:
    paths:
      - "apps/web/src/modules/in-trip/**"
      - "apps/web/src/app/api/trips/[id]/in-trip/**"
      - ".github/workflows/us36-replan-verification.yml"

jobs:
  verify-us36:
    name: Run US-36 In-Trip Replan Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (root monorepo)
        run: bun install --frozen-lockfile || npm ci

      - name: Run US-36 Vitest Suite
        working-directory: apps/web
        run: |
          npx vitest run --config vitest.config.mts \
            src/modules/in-trip/us36-test.vitest.test.ts \
            src/modules/in-trip/split-trip.vitest.test.ts \
            src/modules/in-trip/preserve-completed.vitest.test.ts \
            src/modules/in-trip/mandatory-endpoint.vitest.test.ts \
            src/modules/in-trip/replan-service.vitest.test.ts \
            src/modules/in-trip/replan-http.vitest.test.ts \
            src/modules/in-trip/replan-ai-service.vitest.test.ts \
            src/modules/in-trip/replan-verify.vitest.test.ts \
            --reporter=verbose | tee us36-ci-report.txt

      - name: Upload US-36 Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us36-verification-evidence
          path: apps/web/us36-ci-report.txt
          retention-days: 30
