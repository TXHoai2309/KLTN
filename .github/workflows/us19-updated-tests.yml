
name: Sprint 3 - US19 Updated Tests

on:
  workflow_dispatch:
  push:
    branches:
      - kduy

permissions:
  contents: read

jobs:
  test-us19:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup npm
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Run US19 unit tests
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --config vitest.config.mts \
            src/modules/rag-index/rag-index-route.vitest.test.ts \
            src/modules/rag-index/rag-index-job-service.vitest.test.ts \
            src/modules/rag-index/rag-index-worker.vitest.test.ts \
            src/modules/rag-index/rag-index-store.vitest.test.ts \
            src/app/admin/rag/rag-index-panel.vitest.test.ts \
            2>&1 | tee ../../us19-unit.log

      - name: Run PostgreSQL integration
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          npm run test:rag-index:postgres \
            2>&1 | tee ../../us19-postgres.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: US19-Updated-Evidence
          path: |
            us19-unit.log
            us19-postgres.log
          if-no-files-found: warn
