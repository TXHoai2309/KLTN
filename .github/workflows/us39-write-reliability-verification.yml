name: Sprint 5 - US39 Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master, kduy]
    paths:
      - "apps/web/src/server/http/idempotency*"
      - "apps/web/src/lib/mutation-*"
      - "apps/web/src/modules/trip-edit/**"
      - ".github/workflows/us39-write-reliability-verification.yml"
  pull_request:
    paths:
      - "apps/web/src/server/http/idempotency*"
      - "apps/web/src/lib/mutation-*"
      - ".github/workflows/us39-write-reliability-verification.yml"

jobs:
  verify-us39:
    name: Run US-39 Write Reliability & Idempotency Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (root monorepo)
        run: bun install --frozen-lockfile || npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"

      - name: Run US-39 Idempotency & Mutation Test Suite
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"
        run: |
          set -o pipefail
          {
            echo "=== 1. Running Server Idempotency Unit Tests ==="
            npm run test:idempotency

            echo "=== 2. Running Client Mutation & Replay Vitest Suite ==="
            npx vitest run --config vitest.config.mts \
              src/lib/mutation-client.vitest.test.ts \
              src/modules/trip-edit/trip-edit-http.vitest.test.ts \
              src/modules/trip-edit/us32-test.vitest.test.ts \
              --reporter=verbose
          } | tee us39-ci-report.txt

      - name: Upload US-39 Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us39-verification-evidence
          path: apps/web/us39-ci-report.txt
          retention-days: 30
