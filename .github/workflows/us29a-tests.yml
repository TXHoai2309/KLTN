
name: Sprint 4 - US29A Tests

on:
  workflow_dispatch:
  push:
    branches:
      - kduy

permissions:
  contents: read

jobs:
  test-us29a:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup npm
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Run US29A unit tests
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --config vitest.config.mts \
            src/modules/trip-validation/visit-constraints.vitest.test.ts \
            2>&1 | tee ../../us29a-results.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: US29A-Results
          path: us29a-results.log
          if-no-files-found: warn
