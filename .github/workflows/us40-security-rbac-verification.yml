name: Sprint 5 - US40 Security & RBAC Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master, kduy]
    paths:
      - "apps/web/src/server/authorization/**"
      - "apps/web/src/server/auth/**"
      - "apps/web/src/modules/in-trip/us35-location-source-audit.vitest.test.ts"
      - ".github/workflows/us40-security-rbac-verification.yml"
  pull_request:
    paths:
      - "apps/web/src/server/authorization/**"
      - "apps/web/src/server/auth/**"
      - ".github/workflows/us40-security-rbac-verification.yml"

jobs:
  verify-us40:
    name: Run US-40 Security, RBAC & Isolation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (root monorepo)
        run: bun install --frozen-lockfile || npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"

      - name: Run US-40 Security & RBAC Suite
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"
        run: |
          set -o pipefail
          {
            echo "=== 1. Running RBAC & Authorization Tests ==="
            npm run test:authorization

            echo "=== 2. Running Security, Privacy & Prompt-Injection Audit Tests ==="
            npx vitest run --config vitest.config.mts \
              src/modules/in-trip/us35-location-source-audit.vitest.test.ts \
              src/modules/trip-edit/us33-test.vitest.test.ts \
              src/modules/in-trip/us36-test.vitest.test.ts \
              --reporter=verbose
          } | tee us40-ci-report.txt

      - name: Upload US-40 Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us40-verification-evidence
          path: apps/web/us40-ci-report.txt
          retention-days: 30
