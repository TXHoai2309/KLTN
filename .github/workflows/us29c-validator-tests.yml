
name: US29C Validator Tests

on:
  workflow_dispatch:
  push:
    branches:
      - kduy
    paths:
      - '.github/workflows/us29c-validator-tests.yml'
      - 'apps/web/src/modules/trip-validation/**'

permissions:
  contents: read

jobs:
  test-us29c:
    name: Run US29C Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run US29C tests
        working-directory: apps/web
        run: |
          npx --no-install vitest run \
            --config vitest.config.mts \
            src/modules/trip-validation/trip-validation.vitest.test.ts \
            src/modules/trip-validation/trip-validation-panel.vitest.test.ts
